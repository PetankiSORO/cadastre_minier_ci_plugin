name: "⛏️ update cadastre minier ci plugin (24h)"

on:
  schedule:
    # Exécution toutes les 6 heures : 01h, 07h, 13h, 19h UTC
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-cadastre-minier-ci:
    runs-on: ubuntu-latest
    
    steps:
        - name: "Checkout du repo"
          uses: actions/checkout@v4
    
        - name: "Setup Python"
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
    
        - name: "Installer les dépendances"
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
    
        - name: "Lancer le pipeline"
          env:
            GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
            GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
            GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
            DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
            LOG_LEVEL: INFO
          run: python main.py
    
        - name: "Commit et push du fichier de sortie"
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/*.gpkg
            git diff --cached --quiet || git commit -m "Mise à jour automatique du cadastre ($(date +%Y-%m-%d))"
            git push
            
        - name: "✅ Notification succès"
          if: success()
          run: |
            echo "✅ mise a jour du cadastre à $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            
        - name: "🚨 Création d'une issue en cas d'échec"
          if: failure()
          uses: actions/github-script@v7
          with:
            script: |
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `❌ Échec update cadastre minier ci plugin  — ${new Date().toISOString().split('T')[0]} ${new Date().toISOString().split('T')[1].split('.')[0]} UTC`,
                body: [
                  "## Détails de l'erreur",
                  `- **Run ID** : ${context.runId}`,
                  `- **Branch** : ${context.ref}`,
                  `- **Lien** : [Voir le workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                  "",
                  "## Vérifier",
                  "1. Les logs du workflow",
                  "2. La disponibilité de l'API Landfolio",
                  "3. Les secrets GitHub configurés :",
                  "   - `GDRIVE_CLIENT_ID`",
                  "   - `GDRIVE_CLIENT_SECRET`",
                  "   - `GDRIVE_REFRESH_TOKEN`",
                  "   - `DRIVE_FOLDER_ID`",
                  "4. Les quotas Google Drive",
                ].join("\n"),
                labels: ["bug", "automated"],
              });
